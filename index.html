<script type="text/javascript">
$(document).ready(function() {
    var windowWidth = window.innerWidth;
    if(windowWidth>600){
        $('body,html').css({background:'gray'});
        
        $("#wrapper_login").css({width:'600px',margin:'0 auto -110px', background:'#F0EFF4', minHeight: '100%'});
        if($('#wrapper_login').height() < window.innerHeight){
            $("#wrapper_login").css({height:window.innerHeight+'px'});
        }
        
        $('#fixed-footer').css({width:'600px', left:0, right:0, margin:'0 auto'});
    }

    function getRandom(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getScores(id) {
        var real_cls = id.substring(0, 2);

        var key = 'ycf_score_' + id;
        var saved = localStorage.getItem(key);
        
        if (saved) {
            var data = JSON.parse(saved);
            data.cls = real_cls; 
            return data;
        }

        var yw = getRandom(110, 122); 
        var sx = getRandom(122, 140); 
        var wy = getRandom(105, 135); 

        var wl_raw = getRandom(70, 85); 
        var wl_assign = getRandom(Math.max(wl_raw, 91), 100); 

        var hx_raw = getRandom(70, 88); 
        var hx_assign = getRandom(Math.max(hx_raw, 91), 99); 

        var sw_raw = getRandom(80, 98); 
        var sw_assign = getRandom(Math.max(sw_raw, 92), 100); 
        
        var raw_total = yw + sx + wy + wl_raw + hx_raw + sw_raw;
        var assign_total = yw + sx + wy + wl_assign + hx_assign + sw_assign;

        var cls_rank = getRandom(4, 8); 
        var grade_rank = getRandom(40, 150); 

        var data = {
            id: id, 
            cls: real_cls, 
            cls_rank: cls_rank, grade_rank: grade_rank,
            raw_total: raw_total, assign_total: assign_total,
            yw: yw, yw_rank: getRandom(1, 150),
            sx: sx, sx_rank: getRandom(1, 50),
            wy: wy, wy_rank: getRandom(1, 100),
            wl_raw: wl_raw, wl_assign: wl_assign, wl_rank: getRandom(1, 80),
            hx_raw: hx_raw, hx_assign: hx_assign, hx_rank: getRandom(1, 90),
            sw_raw: sw_raw, sw_assign: sw_assign, sw_rank: getRandom(1, 70)
        };
        localStorage.setItem(key, JSON.stringify(data));
        return data;
    }

    function buildTableHtml(data) {
        var html = '';
        function row(label, val) {
            return '<tr><td class="left_cell"><span>' + label + '</span></td><td class="right_cell">' + val + '</td></tr>';
        }
        html += row("班级", data.cls);
        html += row("序", data.cls_rank);
        html += row("查询号", data.id);
        html += row("原总", data.raw_total);
        html += row("总等", data.assign_total);
        html += row("序", data.grade_rank);
        html += row("语文", data.yw);
        html += row("序", data.yw_rank);
        html += row("数学", data.sx);
        html += row("序", data.sx_rank);
        html += row("外语", data.wy);
        html += row("序", data.wy_rank);
        html += row("物理", data.wl_raw);
        html += row("物等", data.wl_assign);
        html += row("序", data.wl_rank);
        html += row("化学", data.hx_raw);
        html += row("化等", data.hx_assign);
        html += row("序", data.hx_rank);
        html += row("生物", data.sw_raw);
        html += row("生等", data.sw_assign);
        html += row("序", data.sw_rank);
        html += row("政治", ""); html += row("政等", ""); html += row("序", "");
        html += row("历史", ""); html += row("历等", ""); html += row("序", "");
        html += row("地理", ""); html += row("地等", ""); html += row("序", "");
        return html;
    }

    $("#yiDunSubmitBtn").unbind('click').click(function() {
        var inputVal = $("#s_chaxunhao_input").val();
        if (!inputVal) {
            $.alert("请输入查询号");
            return;
        }

        var $btn = $(this);
        $btn.addClass('weui-btn_disabled').text('查询中...');
        
        setTimeout(function() {
            var scoreData = getScores(inputVal);
            $("#score_table").html(buildTableHtml(scoreData));

            $("#wrapper_login").hide();
            $("#fixed-footer").hide();

            $("#wrapper").show();
            $(".more-opt-box").css('display', 'flex'); 

            if(windowWidth > 600) {
                $("#wrapper").css({width:'600px', margin:'0 auto', background:'#FFFFFF', minHeight: '100%'});
                $('.more-opt-box').css({width: '600px', left:0, right:0, margin:'0 auto'});
            } else {
                $('body,html').css({background:'#FFFFFF'});
            }

            $(window).scrollTop(0);
            $btn.removeClass('weui-btn_disabled').text('查询');
        }, 800);
    });
});
</script>
